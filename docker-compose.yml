services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tagme3a
      POSTGRES_PASSWORD: tagme3a
      POSTGRES_DB: tagme3a
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagme3a -d tagme3a"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://tagme3a:tagme3a@db:5432/tagme3a
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
             python -m app.services.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://tagme3a:tagme3a@db:5432/tagme3a
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.WorkerSettings

volumes:
  pgdata:
  meilidata:
